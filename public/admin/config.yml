backend:
  name: github
  repo: kilicygt/izmir-uzmani
  branch: main
  base_url: https://izmiruzmani.com
  auth_endpoint: /api/auth

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog Yazıları
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Başlık, name: title, widget: string}
      - {label: Açıklama, name: description, widget: string}
      - {label: Yayın Tarihi, name: pubDate, widget: datetime}
      - {label: Kategori, name: category, widget: string}
      - {label: Etiketler, name: tags, widget: list}
      - {label: Öne Çıkan, name: featured, widget: boolean, default: false}
      - {label: İçerik, name: body, widget: markdown}
