name: Nöbetçi eczaneleri güncelle

on:
  schedule:
    # Duty shifts change at 08:00 İzmir time; run at 08:12 (05:12 UTC) and again at 10:12
    # in case the city's list was published late. The second run commits nothing if unchanged.
    - cron: '12 5 * * *'
    - cron: '12 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pharmacies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch on-duty pharmacies from openapi.izmir.bel.tr
        run: node scripts/fetch-pharmacies.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/eczane.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Nöbetçi eczaneleri güncelle"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
