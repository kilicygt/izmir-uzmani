name: Günlük bülteni hazırla

on:
  schedule:
    # 07:23 İzmir time (after the 06:17 events/transit run), refreshed at 17:23 with the day's later news.
    - cron: '23 4 * * *'
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bulten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build today's bulletin from official sources
        run: node scripts/fetch-bulten.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/bulten
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Günlük bülteni güncelle"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
