name: Zamanlanmış rehberleri yayınla

on:
  schedule:
    # 07:05 and 17:05 İzmir time: guides are scheduled for 07:00 and 17:00 (pubDate in src/content/blog).
    - cron: '5 4 * * *'
    - cron: '5 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      - name: List guides whose publish time has passed
        run: node scripts/publish-due.mjs

      # A changed list means a scheduled guide just became due; pushing it makes Vercel rebuild and publish it.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/yayinlanan-rehberler.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Zamanlanmış rehberleri yayınla"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
